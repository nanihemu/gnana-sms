services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gnana
      POSTGRES_USER: gnana
      POSTGRES_PASSWORD: gnana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnana -d gnana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app                 # live code reload during development
    environment:               # DB_HOST=db points at the db service; ALLOWED_HOSTS=* for dev
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gnana
      DB_USER: gnana
      DB_PASSWORD: gnana
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      SECRET_KEY: dev-insecure-docker-compose-only
      DEMO_PASSWORD: demo1234
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
